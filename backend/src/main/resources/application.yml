spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wedding}
    username: ${DB_USER:wedding}
    password: ${DB_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
    timeout: 24h
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  origin: ${APP_PUBLIC_ORIGIN:http://localhost:8088}
  token-key: ${TOKEN_KEY}
  admin-user: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  media-root: ${MEDIA_ROOT:./data/media}
  cleanup:
    interval-ms: ${CLEANUP_INTERVAL_MS:3600000}
    initial-delay-ms: ${CLEANUP_INITIAL_DELAY_MS:60000}
    import-preview-retention-days: ${IMPORT_PREVIEW_RETENTION_DAYS:7}
    export-retention-days: ${EXPORT_RETENTION_DAYS:2}